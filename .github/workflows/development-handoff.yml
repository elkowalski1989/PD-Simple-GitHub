name: development-handoff

on:
  push:
    branches: [work/pcb-developer-experience]
    paths: [.github/workflows/development-handoff.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Archive exact tracked source without Git credentials
        shell: bash
        run: |
          mkdir -p handoff
          git archive --format=zip --output=handoff/source.zip HEAD
          git ls-tree -r -z HEAD > handoff/tree.bin
          git rev-parse HEAD > handoff/commit.txt
          sha256sum handoff/source.zip > handoff/source.sha256
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: pd-simple-source
          path: handoff/
          retention-days: 3
          if-no-files-found: error
