name: apply-native-source
on:
  push:
    branches: [work/allegro-native-workflows]
    paths: [.github/workflows/apply-native-source.yml]
permissions:
  contents: write
jobs:
  preserve:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Verify source baseline and exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/allegro-native-workflows
          git diff --exit-code 931fde0af55e3b1ecb60934af96acc6a7366e00c -- . ':(exclude).development/**' ':(exclude).github/workflows/apply-native-source.yml'
          python - <<'PY'
          import base64, hashlib, lzma, pathlib
          encoded = pathlib.Path('.development/native.patch.xz.b64.0').read_text().strip()
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != 'a99d4fe1f81e5cdca7fa6a9e25f2d0936ade4e52c1aa5f1370758d2b7a21afe4':
              raise SystemExit('Patch mismatch. No source applied.')
          pathlib.Path('.development/verified.patch').write_bytes(patch)
          PY
          git apply --check --index .development/verified.patch
          git apply --index .development/verified.patch
          git diff --cached --check
      - name: Check project and interface XML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem -Recurse -File -Include *.csproj,*.props,*.targets,*.xaml,*.manifest) {
            [xml]$parsed = Get-Content -Raw -LiteralPath $file.FullName
          }
      - name: Commit source and remove transport machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm .development/native.patch.xz.b64.0 .github/workflows/apply-native-source.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Connect Explorer placement to native edits and live canvas handles" -m "Add guarded native Apply/Undo, actual user-driven move and ruler handles, explicit grid snapping and uncertain-outcome tracking. Preserve admitted recovery through presentation failures and no-mutation rejection. Coordinate preview.3 package references. No studio, simulated input, native acceptance or recorder qualification claimed."
          git push origin HEAD:refs/heads/work/allegro-native-workflows
          git rev-parse HEAD
