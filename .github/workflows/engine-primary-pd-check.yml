name: engine-primary-pd-check

on:
  pull_request:
  push:
    branches: [main, feature/engine-primary-api-20260911, feature/engine-unified-suite-20260911]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-primary-pd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Enforce Engine-primary source boundary
        run: python3 scripts/check-engine-boundary.py
      - name: Validate XML and XAML structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in sorted(Path('.').rglob('*')):
              if path.suffix.lower() in {'.xaml', '.csproj', '.props', '.targets'}:
                  ET.parse(path)
                  print('OK', path)
          PY
      - name: Parse local Bridge rebuild helper
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          $path = Join-Path $PWD 'scripts/rebuild-with-local-bridge.ps1'
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'rebuild-with-local-bridge.ps1 has PowerShell syntax errors.'
          }
      - name: Verify local Bridge version rewrite is unambiguous
        shell: pwsh
        run: |
          $text = Get-Content -LiteralPath 'Directory.Build.props' -Raw
          $pattern = '(<AllegroBridgePackageVersion\b[^>]*>)[^<]*(</AllegroBridgePackageVersion>)'
          $version = '9.8.7-preview.654'
          $replacement = '${1}' + $version + '${2}'
          $rewritten = [Text.RegularExpressions.Regex]::Replace($text, $pattern, $replacement)
          [xml]$xml = $rewritten
          $nodes = @($xml.SelectNodes('//AllegroBridgePackageVersion'))
          if ($nodes.Count -ne 1 -or $nodes[0].InnerText -ne $version) {
            throw "Version rewrite failed: expected $version."
          }
          if ($rewritten.Contains('[]')) {
            throw 'Version rewrite unexpectedly produced an empty NuGet version range.'
          }
      - name: Require flagship capability sections
        run: |
          grep -F 'Allegro Engine showcase' src/PD.Simple/MainWindow.xaml
          grep -F 'Constraints / DRC' src/PD.Simple/MainWindow.xaml
          grep -F 'Physical symbols' src/PD.Simple/MainWindow.xaml
          grep -F 'Padstacks' src/PD.Simple/MainWindow.xaml
          grep -F 'Manufacturing' src/PD.Simple/MainWindow.xaml
      - name: Preserve exact consumer source for coordinated inspection
        if: always()
        run: git archive --format=zip --output=pd-source.zip HEAD
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: pd-source-${{ github.sha }}
          path: pd-source.zip
          retention-days: 3

  windows-consumer:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Restore flagship against checked-in matching preview packages
        run: dotnet restore src/PD.Simple/PD.Simple.csproj --force --no-cache
      - name: Build flagship WPF application
        run: dotnet build src/PD.Simple/PD.Simple.csproj -c Release --no-restore -m:1 -tl:off
      - name: Run managed operation and connection checks
        run: dotnet run --project tests/PD.Simple.Checks/PD.Simple.Checks.csproj -c Release
      - name: Run reusable PCB tools checks
        run: dotnet run --project tests/PD.PcbTools.Checks/PD.PcbTools.Checks.csproj -c Release
      - name: Run Windows drawing and application-surface checks
        run: dotnet run --project tests/PD.Simple.DrawingChecks/PD.Simple.DrawingChecks.csproj -c Release
