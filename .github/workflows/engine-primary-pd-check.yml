name: engine-primary-pd-check

on:
  pull_request:
  push:
    branches: [main, feature/engine-primary-api-20260911]

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Enforce Engine-primary source boundary
        run: python3 scripts/check-engine-boundary.py
      - name: Validate XML and XAML structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in sorted(Path('.').rglob('*')):
              if path.suffix.lower() in {'.xaml', '.csproj', '.props', '.targets'}:
                  ET.parse(path)
                  print('OK', path)
          PY
      - name: Parse local Bridge rebuild helper
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          $path = Join-Path $PWD 'scripts/rebuild-with-local-bridge.ps1'
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | Format-List
            throw 'rebuild-with-local-bridge.ps1 has PowerShell syntax errors.'
          }
      - name: Verify local Bridge version rewrite is unambiguous
        shell: pwsh
        run: |
          $text = Get-Content -LiteralPath 'Directory.Build.props' -Raw
          $pattern = '(<AllegroBridgePackageVersion\b[^>]*>)[^<]*(</AllegroBridgePackageVersion>)'
          $version = '9.8.7-preview.654'
          $replacement = '${1}' + $version + '${2}'
          $rewritten = [Text.RegularExpressions.Regex]::Replace($text, $pattern, $replacement)
          [xml]$xml = $rewritten
          $nodes = @($xml.SelectNodes('//AllegroBridgePackageVersion'))
          if ($nodes.Count -ne 1 -or $nodes[0].InnerText -ne $version) {
            throw "Version rewrite failed: expected $version."
          }
          if ($rewritten.Contains('[]')) {
            throw 'Version rewrite unexpectedly produced an empty NuGet version range.'
          }
      - name: Require flagship capability sections
        run: |
          grep -F 'Allegro Engine showcase' src/PD.Simple/MainWindow.xaml
          grep -F 'Constraints / DRC' src/PD.Simple/MainWindow.xaml
          grep -F 'Physical symbols' src/PD.Simple/MainWindow.xaml
          grep -F 'Padstacks' src/PD.Simple/MainWindow.xaml
          grep -F 'Manufacturing' src/PD.Simple/MainWindow.xaml
