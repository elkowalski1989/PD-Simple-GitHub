name: apply-engine-reconstruction
on:
  push:
    branches: [wip/allegro-engine-20260911]
    paths: [.github/workflows/apply-engine-reconstruction.yml]
permissions:
  contents: write
jobs:
  preserve:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Validate source baseline and exact coordinated patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/wip/allegro-engine-20260911
          git diff --exit-code 3f2dc2ac48c98dbf3f1941bd3461602ecac901db -- . ':(exclude).development/**' ':(exclude).github/workflows/apply-engine-reconstruction.yml'
          python - <<'PY'
          import base64, hashlib, lzma, pathlib
          content = ''.join(pathlib.Path(f'.development/engine.patch.xz.b64.{i}').read_text().strip() for i in range(3))
          patch = lzma.decompress(base64.b64decode(content, validate=True))
          if hashlib.sha256(patch).hexdigest() != 'fc3dec18ca1fd8030d63d914a3a355311478159a9e66de341981599a1f4a1328':
              raise SystemExit('Patch content mismatch; no source applied.')
          pathlib.Path('.development/verified.patch').write_bytes(patch)
          PY
          git apply --check --index .development/verified.patch
          git apply --index .development/verified.patch
          git diff --cached --check
      - name: Check XML and PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem -Recurse -File -Include *.csproj,*.props,*.targets,*.xaml,*.manifest) {
            [xml]$parsed = Get-Content -Raw -LiteralPath $file.FullName
          }
          foreach ($path in @('Build.ps1', 'installer/Install.ps1')) {
            $parseErrors = $null
            $tokens = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -ne 0) { $parseErrors | Format-List; throw "$path syntax failed." }
          }
      - name: Commit complete source before separate private-SDK integration checks
        shell: bash
        run: |
          set -euo pipefail
          git rm .development/engine.patch.xz.b64.* .github/workflows/apply-engine-reconstruction.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Integrate typed engine scenes and recoverable capture into PD tools" -m "Add live/offline public-API Explorer, shared geometry/annotation and placement-preview controls, SDK-owned native-window capture and bounded window-local overlay recovery. Preserve explicit native/package/recording qualification limits. No studio or native input injection. New reconstruction replaces the missing consumer work, not recovered originals."
          git push origin HEAD:refs/heads/wip/allegro-engine-20260911
          git rev-parse HEAD
