name: apply-engine-route-migration

on:
  push:
    branches:
      - feature/engine-primary-api-20260911
    paths:
      - .github/workflows/apply-engine-route-migration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4.2.2
        with:
          ref: feature/engine-primary-api-20260911
          fetch-depth: 0

      - name: Apply guarded source transformation
        run: python scripts/apply_engine_route_migration.py

      - name: Verify migration boundary and diff
        run: |
          python scripts/check-engine-boundary.py
          git diff --check
          git diff --stat

      - name: Commit production route migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PD.Simple/BridgeSession.cs \
                  src/PD.Simple/BridgeSession.PcbTools.cs \
                  src/PD.Simple/BoardOverlayController.cs \
                  tests/PD.Simple.Checks/Program.cs \
                  scripts/check-engine-boundary.py
          git commit -m "Migrate production trace lifecycle to Engine"
          git push origin HEAD:feature/engine-primary-api-20260911
