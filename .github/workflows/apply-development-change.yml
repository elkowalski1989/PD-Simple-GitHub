name: apply-development-change
on:
  push:
    branches: [work/pcb-developer-experience]
    paths: [.github/workflows/apply-development-change.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Verify unchanged product baseline and exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/pcb-developer-experience
          git diff --exit-code 8c53e104cb0f31aade55999ea50b1752a2407fc3 -- . ':(exclude).development/**' ':(exclude).github/workflows/development-handoff.yml' ':(exclude).github/workflows/apply-development-change.yml'
          python - <<'PY'
          import base64, hashlib, lzma, pathlib
          parts = [pathlib.Path(f'.development/pd.patch.xz.b64.{index}').read_text().strip() for index in range(8)]
          patch = lzma.decompress(base64.b64decode(''.join(parts), validate=True))
          if hashlib.sha256(patch).hexdigest() != '4a0173ad22bd3136d3c2fe9d7aa9659652d3d7e80fb4fc54dd23bf9e1b8e73c1':
              raise SystemExit('Patch hash mismatch; no source changes applied.')
          pathlib.Path('.development/verified.patch').write_bytes(patch)
          PY
          git apply --check --index .development/verified.patch
          git apply --index .development/verified.patch
          git diff --cached --check
      - name: Check project XML and installer syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $xmlFiles = @(Get-ChildItem -Recurse -File -Include *.csproj,*.props,*.targets,*.xaml,*.manifest | Where-Object { $_.FullName -notmatch '[\\/](bin|obj|\.git)[\\/]' })
          foreach ($file in $xmlFiles) { [xml]$parsed = Get-Content -Raw -LiteralPath $file.FullName }
          foreach ($path in @('Build.ps1', 'installer/Install.ps1')) {
            $parseErrors = $null
            $tokens = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -ne 0) { $parseErrors | Format-List; throw "$path syntax failed." }
          }
          Write-Host 'XML and PowerShell syntax passed. Source compilation and managed tests are recorded separately; private SDK integration runs in the SDK repository.'
      - name: Commit product changes and remove temporary handoff machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch .development/pd.patch.xz.b64.* .github/workflows/development-handoff.yml .github/workflows/apply-development-change.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Integrate managed PCB tools and add public-API Board Explorer" -m "Wire production corridor and route workflows through reusable managed tools and SDK-owned native operations. Preserve coverage warnings, specific recovery, retained native reference source, and explicit native parity limits. Add package-only Board Explorer, capture interruption recovery, operator acceptance instructions, and focused managed regressions."
          git push origin HEAD:refs/heads/work/pcb-developer-experience
          git rev-parse HEAD
